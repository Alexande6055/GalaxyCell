<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyCell - Image Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #00d2ff; }
        .upload-section { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #333; }
        input[type="file"] { margin: 10px 0; padding: 10px; background: #333; border: 1px dashed #555; border-radius: 5px; cursor: pointer; width: 80%; }
        button { background: #00d2ff; color: #121212; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0099cc; }
        #status { margin-top: 10px; font-size: 0.9rem; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-top: 20px; }
        .card { background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .card p { font-size: 0.7rem; color: #aaa; word-break: break-all; margin: 5px 0 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>GalaxyCell API</h1>
        
        <div class="upload-section">
            <h3>Subir Nueva Imagen</h3>
            <input type="file" id="imageInput" accept="image/*">
            <br>
            <button onclick="uploadImage()">Subir a la Nube</button>
            <p id="status"></p>
        </div>

        <h3>Galería del Servidor</h3>
        <button onclick="loadImages()" style="background: #333; color: white;">Refrescar Galería</button>
        <div class="gallery" id="gallery">
            </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        // 1. FUNCIÓN PARA SUBIR IMAGEN
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const status = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                status.innerText = "❌ Selecciona un archivo primero";
                status.style.color = "#ff4444";
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]); // 'image' debe coincidir con NestJS

            status.innerText = "⏳ Subiendo...";
            status.style.color = "#ffeb3b";

            try {
                const response = await fetch(`${API_URL}/images`, {
                    method: 'POST',
                    body: formData // NOTA: No enviamos Headers manuales, el navegador lo hace
                });

                if (response.ok) {
                    const result = await response.json();
                    status.innerText = "✅ ¡Subida con éxito!";
                    status.style.color = "#00ff88";
                    fileInput.value = ''; // Limpiar input
                    loadImages(); // Recargar galería
                } else {
                    const error = await response.json();
                    status.innerText = `❌ Error: ${error.message || 'Falló la subida'}`;
                    status.style.color = "#ff4444";
                }
            } catch (err) {
                status.innerText = "❌ Error de conexión con el servidor";
                status.style.color = "#ff4444";
            }
        }

        // 2. FUNCIÓN PARA CARGAR TODAS LAS IMÁGENES
        async function loadImages() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "Cargando...";

            try {
                const response = await fetch(`${API_URL}/images`);
                const images = await response.json();

                gallery.innerHTML = ""; // Limpiar
                
                if (images.length === 0) {
                    gallery.innerHTML = "<p>No hay imágenes aún.</p>";
                    return;
                }

                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // La URL viene del backend como /uploads/nombre.png
                    // La concatenamos con la URL del servidor
                    const fullUrl = `${API_URL}${img.url}`;
                    
                    card.innerHTML = `
                        <img src="${fullUrl}" alt="Preview" onerror="this.src='https://via.placeholder.com/150?text=Error+Carga'">
                        <p>${img.filename}</p>
                    `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                gallery.innerHTML = "Error al conectar para listar imágenes.";
            }
        }

        // Cargar imágenes al iniciar la página
        loadImages();
    </script>
</body>
</html>
